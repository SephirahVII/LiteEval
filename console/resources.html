<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>LiteEval · Model Connections</title>
  <style>
    [hidden]{display:none!important}
    body{font:15px system-ui,sans-serif;max-width:960px;margin:32px auto;padding:0 16px;color:#182335}
    form{display:flex;align-items:end;flex-wrap:wrap;gap:12px;margin:12px 0}label{display:grid;gap:6px}
    input,select,button{font:inherit;padding:7px}input{width:min(28ch,78vw)}article{border:1px solid #c6d2e1;border-radius:8px;padding:12px 16px;margin:12px 0;overflow-wrap:anywhere}
    h2{font-size:1.1rem}button{cursor:pointer}
  </style>
</head>
<body>
  <a href="/">LiteEval Console</a>
  <h1>模型连接 / Model Connections</h1>
  <p id="status" role="status">正在检查本机会话</p>
  <form id="login" method="post" hidden>
    <label>Owner 用户名<input name="username" autocomplete="username" required></label>
    <label>密码<input name="password" type="password" autocomplete="current-password" required></label>
    <button type="submit">登录</button>
  </form>
  <main id="resources" hidden>
    <button id="logout" type="button">退出登录</button>
    <form id="project-form" method="post">
      <label>项目<select id="project" aria-label="项目"></select></label>
      <label>新项目名称<input name="name" maxlength="200" required></label>
      <button type="submit">创建项目</button>
    </form>
    <form id="connection-form" method="post" hidden>
      <label>连接名称<input name="name" maxlength="200" required></label>
      <label>协议<select name="kind"><option value="openai_compatible">OpenAI-compatible</option><option value="http_agent">HTTP Agent</option></select></label>
      <label>API 地址<input name="endpoint" type="url" required></label>
      <label>模型 ID<input name="model" maxlength="200"></label>
      <label>供应商 API Key<input name="key" type="password" autocomplete="off"></label>
      <button type="submit">保存连接</button>
    </form>
    <section id="connections" aria-label="已保存的模型连接"></section>
  </main>
  <script src="/resources.js" defer></script>
</body>
</html>
