<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>LiteEval · Live Trajectory</title>
  <style>
    body{font:15px system-ui,sans-serif;max-width:960px;margin:32px auto;padding:0 16px;color:#182335}
    form{display:flex;align-items:end;flex-wrap:wrap;gap:12px}label{display:grid;gap:6px}
    input,button{font:inherit;padding:7px}input{width:min(29ch,80vw)}
    article{border:1px solid #c6d2e1;border-radius:8px;padding:12px 16px;margin:12px 0}
    pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f1f5f9;padding:8px}
    h2{font-size:1.1rem}time{color:#435871}summary{cursor:pointer}
  </style>
</head>
<body>
  <a href="/">LiteEval Console</a>
  <h1>真实轨迹 / Live Trajectory</h1>
  <p>输入 CLI 启动时返回的 Execution ID。使用该项目的 LiteEval API Key，或使用已登录的 Owner 会话并填写 Project ID。</p>
  <form id="connect" method="post">
    <label>Execution ID<input name="execution" pattern="[a-f0-9]{32}" required></label>
    <label>Project API Key<input name="key" type="password" autocomplete="off"></label>
    <label>Project ID<input name="project" pattern="[a-f0-9]{32}"></label>
    <button type="submit">读取轨迹 / Connect</button>
  </form>
  <p id="status" role="status">等待连接</p>
  <main id="turns" aria-label="Dialogue turns"></main>
  <script src="/trajectory.js" defer></script>
</body>
</html>
