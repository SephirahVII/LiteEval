<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LiteEval 控制台 · 原型</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
/* ============ 设计基调：深色观测台（参照 STEALTH observability） ============ */
:root {
  --paper: #0A0C10;
  --panel: #12151C;
  --panel-warm: #171B24;
  --sand: #1C212C;
  --line: rgba(255,255,255,.07);
  --line-strong: rgba(255,255,255,.14);
  --ink: #EEF2F6;
  --ink-2: #9AA6B4;
  --muted: #5F6B7A;
  --accent: #3DD68C;
  --accent-deep: #7FE7B4;
  --accent-soft: rgba(61,214,140,.12);
  --pass: #3DD68C;
  --pass-soft: rgba(61,214,140,.12);
  --fail: #F1596B;
  --fail-soft: rgba(241,89,107,.12);
  --warn: #F5C044;
  --warn-soft: rgba(245,192,68,.12);
  --info: #7C9CE8;
  --info-soft: rgba(124,156,232,.12);
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", "Cascadia Mono", Consolas, "Courier New", monospace;
  --sans: "Inter", -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  --serif: Georgia, "Times New Roman", "Songti SC", "SimSun", serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { font-size: 14px; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
/* 细腻纸面纹理：3px 间隔的极淡横线 */
body::before {
  content: "";
  position: fixed; inset: 0;
  background: repeating-linear-gradient(0deg, transparent 0 3px, rgba(203,191,172,.05) 3px 4px);
  pointer-events: none; z-index: 0;
}
#app { position: relative; z-index: 1; }
::selection { background: var(--accent-soft); }
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 3px; }
button { font-family: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible {
  outline: none; box-shadow: 0 0 0 2px var(--paper), 0 0 0 4px var(--accent);
}
.mono { font-family: var(--mono); }
.micro-label {
  font-family: var(--mono); font-size: 10px; font-weight: 600;
  letter-spacing: .18em; text-transform: uppercase; color: var(--muted);
}

/* ============ 按钮 ============ */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid var(--line); border-radius: 999px;
  background: var(--sand); color: var(--ink);
  padding: 7px 16px; font-size: 13px; font-weight: 500;
  transition: background .15s ease, border-color .15s ease, color .15s ease;
}
.btn:hover { background: #EAE0D6; border-color: var(--line-strong); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #FFF9F5; }
.btn.primary:hover { background: var(--accent-deep); border-color: var(--accent-deep); }
.btn.ghost { background: transparent; }
.btn.ghost:hover { background: var(--sand); }
.btn.danger { color: var(--fail); border-color: var(--fail); background: transparent; }
.btn.danger:hover { background: var(--fail-soft); }
.btn.sm { padding: 4px 12px; font-size: 12px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }

/* ============ 登录页 ============ */
.login-wrap {
  min-height: 100vh; display: grid; grid-template-columns: 1.1fr 1fr;
}
.login-hero {
  padding: 64px 56px; display: flex; flex-direction: column; justify-content: space-between;
  border-right: 1px solid var(--line);
}
.login-hero .brand { display: flex; align-items: center; gap: 10px; }
.brand-mark {
  width: 30px; height: 30px; border: 1.5px solid var(--ink); border-radius: 50%;
  display: grid; place-items: center; font-family: var(--mono); font-size: 12px; font-weight: 700;
}
.login-hero h1 {
  font-family: var(--serif); font-size: 56px; font-weight: 400;
  line-height: 1.18; letter-spacing: -.01em; color: var(--ink);
}
.login-hero h1 em { font-style: normal; color: var(--accent); }
.login-hero .sub { color: var(--ink-2); max-width: 420px; margin-top: 18px; font-size: 15px; }
.hero-quote {
  font-family: var(--serif); font-size: 20px; color: var(--ink-2);
  border-left: 2px solid var(--accent); padding-left: 18px; max-width: 400px;
}
.login-panel { padding: 64px 56px; display: flex; flex-direction: column; justify-content: center; }
.login-card { max-width: 380px; width: 100%; }
.field { margin-bottom: 18px; }
.field label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 6px; color: var(--ink-2); }
.field input, .field select {
  width: 100%; padding: 10px 14px; font-size: 14px; font-family: inherit;
  border: 1px solid var(--line-strong); border-radius: 10px; background: var(--panel); color: var(--ink);
}
.field input:focus { border-color: var(--accent); }
.csrf-note {
  display: flex; gap: 8px; align-items: flex-start;
  font-size: 12px; color: var(--ink-2); background: var(--panel-warm);
  border: 1px dashed var(--line-strong); border-radius: 10px; padding: 10px 12px; margin: 18px 0;
}
.divider { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 12px; margin: 22px 0; }
.divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }

/* ============ 应用骨架 ============ */
.shell { display: grid; grid-template-columns: 232px 1fr; min-height: 100vh; }
.sidebar {
  border-right: 1px solid var(--line); padding: 20px 14px;
  display: flex; flex-direction: column; gap: 2px;
  position: sticky; top: 0; height: 100vh;
}
.sidebar .brand { display: flex; align-items: center; gap: 10px; padding: 4px 10px 20px; }
.sidebar .brand b { font-size: 15px; letter-spacing: -.01em; }
.sidebar .brand span { font-family: var(--mono); font-size: 10px; color: var(--muted); display: block; }
.nav-item {
  display: flex; align-items: center; gap: 10px; padding: 8px 12px;
  border-radius: 8px; font-size: 13.5px; color: var(--ink-2);
  cursor: pointer; border: none; background: none; width: 100%; text-align: left;
  transition: background .15s ease, color .15s ease;
}
.nav-item:hover { background: var(--sand); color: var(--ink); }
.nav-item.active { background: var(--accent-soft); color: var(--accent-deep); font-weight: 600; }
.nav-item .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--line-strong); flex: none; }
.nav-item.active .dot { background: var(--accent); }
.nav-item .count { margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--muted); }
.sidebar-foot { margin-top: auto; border-top: 1px solid var(--line); padding-top: 14px; }
.session-box { padding: 0 10px 12px; font-size: 12px; color: var(--ink-2); }
.session-box .bar { height: 3px; background: var(--sand); border-radius: 2px; margin-top: 8px; overflow: hidden; }
.session-box .bar i { display: block; height: 100%; background: var(--pass); transition: width 1s linear; }
.session-box .bar i.low { background: var(--fail); }

.main { padding: 0 32px 48px; min-width: 0; }
.topbar {
  display: flex; align-items: center; gap: 14px;
  padding: 18px 0 16px; border-bottom: 1px solid var(--line); margin-bottom: 24px;
}
.topbar h2 { font-size: 20px; font-weight: 600; letter-spacing: -.01em; }
.topbar .spacer { flex: 1; }
.worker-pill {
  display: inline-flex; align-items: center; gap: 7px; font-family: var(--mono); font-size: 11px;
  border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; color: var(--ink-2);
}

/* 状态灯 */
.led { width: 8px; height: 8px; border-radius: 50%; flex: none; position: relative; }
.led.on { background: var(--pass); }
.led.on::after {
  content: ""; position: absolute; inset: -4px; border-radius: 50%;
  border: 1px solid var(--pass); opacity: 0; animation: pulse 1.6s ease-in-out infinite;
}
.led.busy { background: var(--accent); }
.led.busy::after {
  content: ""; position: absolute; inset: -4px; border-radius: 50%;
  border: 1px solid var(--accent); opacity: 0; animation: pulse 1.4s ease-in-out infinite;
}
.led.off { background: var(--line-strong); }
@keyframes pulse { 0% { transform: scale(.5); opacity: .9; } 100% { transform: scale(1.4); opacity: 0; } }

/* ============ 通用组件 ============ */
.kpi-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 22px; }
.kpi {
  background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px;
}
.kpi .micro-label { margin-bottom: 8px; display: block; }
.kpi .num { font-family: var(--mono); font-size: 30px; font-weight: 600; letter-spacing: -.02em; }
.kpi .num small { font-size: 14px; color: var(--muted); font-weight: 400; }
.kpi .trend { font-size: 12px; margin-top: 4px; }
.kpi .trend.up { color: var(--pass); }
.kpi .trend.down { color: var(--fail); }

.panel {
  background: var(--panel); border: 1px solid var(--line); border-radius: 14px; margin-bottom: 18px;
}
.panel-head {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 18px; border-bottom: 1px solid var(--line);
}
.panel-head h3 { font-size: 14px; font-weight: 600; }
.panel-head .spacer { flex: 1; }
.panel-body { padding: 16px 18px; }

/* 活动流 ticker */
.ticker {
  display: flex; align-items: center; gap: 12px; overflow: hidden;
  background: var(--panel-warm); border: 1px solid var(--line); border-radius: 999px;
  padding: 8px 18px; margin-bottom: 22px; font-size: 12.5px;
}
.ticker .micro-label { flex: none; }
.ticker-track { flex: 1; overflow: hidden; white-space: nowrap; color: var(--ink-2); }
.ticker-track span { display: inline-block; animation: tick 30s linear infinite; }
@keyframes tick { from { transform: translateX(0); } to { transform: translateX(-50%); } }

/* 表格 */
table.grid { width: 100%; border-collapse: collapse; font-size: 13px; }
table.grid th {
  text-align: left; font-family: var(--mono); font-size: 10px; letter-spacing: .14em;
  text-transform: uppercase; color: var(--muted); font-weight: 600;
  padding: 10px 14px; border-bottom: 1px solid var(--line-strong);
}
table.grid td { padding: 11px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
table.grid tr:last-child td { border-bottom: none; }
table.grid tbody tr { cursor: pointer; transition: background .12s ease; }
table.grid tbody tr:hover { background: var(--panel-warm); }
.id-cell { font-family: var(--mono); font-size: 12px; color: var(--ink-2); }

/* 徽章 */
.badge {
  display: inline-flex; align-items: center; gap: 5px;
  font-family: var(--mono); font-size: 11px; font-weight: 600;
  padding: 2px 10px; border-radius: 999px; border: 1px solid transparent;
}
.badge.pass { color: var(--pass); background: var(--pass-soft); border-color: #CBDDBF; }
.badge.fail { color: var(--fail); background: var(--fail-soft); border-color: #E8C4B9; }
.badge.abstain { color: var(--ink-2); background: var(--sand); border-color: var(--line-strong); }
.badge.error { color: var(--warn); background: var(--warn-soft); border-color: #E5D2A8; }
.badge.running { color: var(--accent-deep); background: var(--accent-soft); border-color: #F3C9A8; }
.badge.queued { color: var(--info); background: var(--info-soft); border-color: #C9D3E0; }
.badge.lock { color: var(--ink-2); background: transparent; border-color: var(--line-strong); }
.badge .led { width: 6px; height: 6px; }

/* 进度条 */
.prog { height: 6px; background: var(--sand); border-radius: 3px; overflow: hidden; min-width: 90px; }
.prog i { display: block; height: 100%; background: var(--accent); border-radius: 3px; transition: width .5s ease; }
.prog.done i { background: var(--pass); }
.prog.fail i { background: var(--fail); }

/* 筛选与分页 */
.toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.chip {
  border: 1px solid var(--line); background: transparent; border-radius: 999px;
  padding: 4px 14px; font-size: 12.5px; color: var(--ink-2); transition: all .15s ease;
}
.chip:hover { border-color: var(--line-strong); }
.chip.active { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.pager { display: flex; align-items: center; gap: 8px; justify-content: flex-end; padding: 12px 18px; }
.pager .info { font-family: var(--mono); font-size: 11px; color: var(--muted); margin-right: auto; }
.pager button {
  width: 28px; height: 28px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--panel); color: var(--ink-2); font-family: var(--mono); font-size: 12px;
}
.pager button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.pager button.cur { background: var(--accent); border-color: var(--accent); color: #fff; }

/* Compare 视图 */
.compare-grid { display: grid; grid-template-columns: 1fr 56px 1fr; gap: 0; align-items: stretch; }
.compare-col { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.compare-col.winner { border-color: var(--pass); box-shadow: 0 0 0 1px var(--pass); }
.compare-col .col-head { padding: 16px 18px; border-bottom: 1px solid var(--line); background: var(--panel-warm); }
.compare-col .big-rate { font-family: var(--mono); font-size: 40px; font-weight: 600; letter-spacing: -.03em; }
.vs-mark {
  align-self: center; justify-self: center; font-family: var(--serif); font-size: 20px;
  color: var(--muted); width: 44px; height: 44px; border: 1px solid var(--line-strong);
  border-radius: 50%; display: grid; place-items: center; background: var(--paper);
}
.delta-chip { font-family: var(--mono); font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 6px; }
.delta-chip.up { color: var(--pass); background: var(--pass-soft); }
.delta-chip.flat { color: var(--ink-2); background: var(--sand); }
.delta-chip.down { color: var(--fail); background: var(--fail-soft); }

/* 抽屉与弹窗 */
.overlay {
  position: fixed; inset: 0; background: rgba(29,23,18,.32);
  display: none; z-index: 40;
}
.overlay.show { display: block; animation: fadeIn .18s ease; }
@keyframes fadeIn { from { opacity: 0; } }
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 92vw);
  background: var(--panel); border-left: 1px solid var(--line-strong);
  transform: translateX(100%); transition: transform .28s cubic-bezier(.32,.72,.28,1);
  z-index: 50; display: flex; flex-direction: column;
}
.drawer.show { transform: translateX(0); }
.drawer-head { padding: 18px 22px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }
.drawer-body { flex: 1; overflow-y: auto; padding: 20px 22px; }
.raw-block {
  font-family: var(--mono); font-size: 12px; line-height: 1.7;
  background: #241E18; color: #E8DFD3; border-radius: 10px; padding: 14px 16px;
  overflow-x: auto; white-space: pre;
}
.modal {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%) scale(.96);
  width: min(480px, 92vw); background: var(--panel); border: 1px solid var(--line-strong);
  border-radius: 16px; z-index: 60; opacity: 0; pointer-events: none;
  transition: opacity .18s ease, transform .18s ease; box-shadow: 0 24px 60px rgba(29,23,18,.18);
}
.modal.show { opacity: 1; transform: translate(-50%,-50%) scale(1); pointer-events: auto; }
.modal-body { padding: 24px; }
.modal-foot { padding: 14px 24px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: 10px; }
.conflict-diff { font-family: var(--mono); font-size: 12px; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; margin: 14px 0; }
.conflict-diff .row { display: grid; grid-template-columns: 90px 1fr 1fr; border-bottom: 1px solid var(--line); }
.conflict-diff .row:last-child { border-bottom: none; }
.conflict-diff .cell { padding: 8px 12px; }
.conflict-diff .cell.old { background: var(--fail-soft); color: var(--fail); text-decoration: line-through; }
.conflict-diff .cell.new { background: var(--pass-soft); color: var(--pass); }

/* Toast */
.toasts { position: fixed; bottom: 24px; right: 24px; z-index: 90; display: flex; flex-direction: column; gap: 10px; }
.toast {
  background: var(--ink); color: var(--paper); border-radius: 12px; padding: 12px 18px;
  font-size: 13px; display: flex; align-items: center; gap: 10px;
  box-shadow: 0 12px 32px rgba(29,23,18,.25); animation: toastIn .25s cubic-bezier(.32,.72,.28,1);
  max-width: 360px;
}
@keyframes toastIn { from { transform: translateY(12px); opacity: 0; } }
.toast .led { width: 7px; height: 7px; }

/* 空状态 */
.empty {
  border: 1px dashed var(--line-strong); border-radius: 12px; padding: 36px;
  text-align: center; color: var(--muted); font-size: 13px;
}

/* 预览运行的时间线 */
.timeline { position: relative; padding-left: 22px; }
.timeline::before { content: ""; position: absolute; left: 6px; top: 6px; bottom: 6px; width: 1px; background: var(--line-strong); }
.timeline .ev { position: relative; padding-bottom: 14px; font-size: 12.5px; color: var(--ink-2); }
.timeline .ev::before {
  content: ""; position: absolute; left: -20px; top: 5px; width: 7px; height: 7px;
  border-radius: 50%; background: var(--panel); border: 1.5px solid var(--line-strong);
}
.timeline .ev.hot::before { border-color: var(--accent); background: var(--accent); }
.timeline .ev b { color: var(--ink); font-weight: 600; }
.timeline .ev .t { font-family: var(--mono); font-size: 10.5px; color: var(--muted); margin-left: 6px; }

/* 页内 Tab */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 16px; }
.tab {
  border: none; background: none; padding: 9px 16px; font-size: 13px; color: var(--ink-2);
  border-bottom: 2px solid transparent; margin-bottom: -1px; transition: color .15s ease, border-color .15s ease;
}
.tab:hover { color: var(--ink); }
.tab.active { color: var(--accent-deep); border-bottom-color: var(--accent); font-weight: 600; }

/* 日志控制台 */
.log-console {
  background: #241E18; color: #D8CDBC; border-radius: 12px; padding: 14px 16px;
  font-family: var(--mono); font-size: 12px; line-height: 1.75;
  max-height: 420px; overflow-y: auto;
}
.log-console .ln { display: flex; gap: 12px; white-space: pre-wrap; word-break: break-all; }
.log-console .ln .no { color: #6B5F52; flex: none; width: 44px; text-align: right; user-select: none; }
.log-console .ln.warn { color: #E5B95C; }
.log-console .ln.err { color: #E88A70; }
.log-console .ln.tool { color: #9FC3E8; }
.log-cursor-bar {
  display: flex; align-items: center; gap: 10px; margin-top: 10px;
  font-family: var(--mono); font-size: 11px; color: var(--muted);
}

/* 统计磁贴 */
.stat-tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.stat-tile { background: var(--panel-warm); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; }
.stat-tile .v { font-family: var(--mono); font-size: 18px; font-weight: 600; margin-top: 2px; }
.stat-tile .v small { font-size: 11px; color: var(--muted); font-weight: 400; }

/* token 分解条 */
.tok-bar { display: flex; height: 14px; border-radius: 7px; overflow: hidden; border: 1px solid var(--line-strong); }
.tok-bar i { display: block; height: 100%; }
.tok-legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 11.5px; color: var(--ink-2); margin-top: 8px; }
.tok-legend .sw { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }

/* 工件行 */
.artifact-row {
  display: flex; align-items: center; gap: 12px; padding: 10px 4px;
  border-bottom: 1px solid var(--line); font-size: 13px;
}
.artifact-row:last-child { border-bottom: none; }
.artifact-row .fname { font-family: var(--mono); font-size: 12.5px; font-weight: 600; }
.artifact-row .fmeta { font-family: var(--mono); font-size: 11px; color: var(--muted); }

/* KV 表 */
.kv { display: grid; grid-template-columns: 130px 1fr; row-gap: 8px; font-size: 13px; }
.kv dt { color: var(--muted); font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; padding-top: 2px; }
.kv dd { color: var(--ink); word-break: break-all; }

.hidden { display: none !important; }
.mt8 { margin-top: 8px; } .mt16 { margin-top: 16px; } .mt24 { margin-top: 24px; }
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }

/* ============ 深色观测台 · 组件覆盖与新组件 ============ */
body::before { background: repeating-linear-gradient(0deg, transparent 0 3px, rgba(255,255,255,.02) 3px 4px); }
::selection { background: rgba(61,214,140,.25); }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,.14); }
.btn { background: var(--sand); border-color: var(--line); color: var(--ink); }
.btn:hover { background: #242B39; border-color: var(--line-strong); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #062316; font-weight: 600; }
.btn.primary:hover { background: var(--accent-deep); border-color: var(--accent-deep); }
.btn.ghost { background: transparent; color: var(--ink-2); }

/* 迷你趋势线：1.5px 细线 + 同色系渐变面积填充 */
let _sparkSeq = 0;
function sparkSVG(values, color, w = 110, h = 34) {
  const min = Math.min(...values), max = Math.max(...values), span = (max - min) || 1;
  const pts = values.map((v, i) => `${(i / (values.length - 1) * w).toFixed(1)},${(h - 3 - (v - min) / span * (h - 8)).toFixed(1)}`);
  const gid = "sp" + (++_sparkSeq);
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${color}" stop-opacity=".35"/><stop offset="1" stop-color="${color}" stop-opacity="0"/>
    </linearGradient></defs>
    <path d="M0,${h} L${pts.join(" L")} L${w},${h} Z" fill="url(#${gid})"/>
    <polyline points="${pts.join(" ")}" fill="none" stroke="${color}" stroke-width="1.5"/>
  </svg>`;
}
function series(seed, base, amp, n = 48) {
  const pts = []; let v = base;
  for (let i = 0; i < n; i++) { v += Math.sin(i / 3.1 + seed) * 1.6 + Math.cos(i / 1.7 + seed * 2) * 0.9; v = Math.max(3, Math.min(78, v)); pts.push(v); }
  return pts;
}
/* 主图：多线时间序列 + 虚线网格 + tiny mono 轴 */
function chartSVG() {
  const W = 760, H = 240, PL = 34, PB = 22, PT = 8;
  const rows = [
    { label: "pass", color: "var(--pass)", data: series(0.5, 34, 70), count: "12,272" },
    { label: "fail", color: "var(--warn)", data: series(2.1, 22, 40), count: "128" },
    { label: "error", color: "var(--fail)", data: series(4.7, 12, 24), count: "38" },
  ];
  const y = (v) => PT + (1 - v / 80) * (H - PT - PB);
  const x = (i, n) => PL + (i / (n - 1)) * (W - PL - 8);
  const grid = [0, 20, 40, 60, 80].map(g => `
    <line x1="${PL}" y1="${y(g)}" x2="${W - 8}" y2="${y(g)}" stroke="rgba(255,255,255,.07)" stroke-dasharray="${g ? "3 5" : "0"}"/>
    <text x="${PL - 6}" y="${y(g) + 3}" text-anchor="end" fill="var(--muted)" font-size="9" font-family="var(--mono)">${g}</text>`).join("");
  const hours = ["00:00","04:00","08:00","12:00","16:00","20:00","24:00"].map((t, i) => `
    <text x="${PL + i * (W - PL - 8) / 6}" y="${H - 6}" text-anchor="middle" fill="var(--muted)" font-size="9" font-family="var(--mono)">${t}</text>`).join("");
  const lines = rows.map(r => `<polyline points="${r.data.map((v, i) => `${x(i, r.data.length).toFixed(1)},${y(v).toFixed(1)}`).join(" ")}" fill="none" stroke="${r.color}" stroke-width="1.5"/>`).join("");
  return { svg: `<svg viewBox="0 0 ${W} ${H}">${grid}${hours}${lines}</svg>`, legend: rows };
}

  if (!/^[A-Z][A-Z0-9_]{0,99}$/.test(name)) { toast("Key 名称仅允许字母、数字和下划线，并以字母开头", false); return; }
  if (userKeys.some(k=>k.name===name)) { toast(`Key ${name} 已存在`, false); return; }
  const v = $("#nkValue").value;

  userKeys.unshift({ id: "key_" + Math.random().toString(16).slice(2,6), name, masked: v ? v.slice(0,3) + "••••••••" + v.slice(-4) : "••••••••", usedBy: [], created: "刚刚", rotatedAt: null });
  closeModal();
  toast(`Key ${name} 已加密保存`);
  render();

  const k = userKeys.find(x=>x.id===id);

function deleteKey(id) {
  const k = userKeys.find(x=>x.id===id);
  if (k.usedBy.length) { toast(`Key ${k.name} 仍被 ${k.usedBy.join("、")} 引用，请先解绑`, false); return; }
  userKeys.splice(userKeys.indexOf(k), 1);
  toast(`Key ${k.name} 已删除`);
  render();
}

    body = `
    <div class="panel">
      <div class="panel-head"><h3>工件</h3><span class="micro-label">读取时核对 SHA-256 · ZIP 导出含实际内容</span>
        <div class="spacer"></div><button class="btn sm ghost" onclick="toast('已请求 run 级 ZIP 导出（rollout.json + records.jsonl + manifest + 工件）')">导出 Run ZIP</button></div>
      <div class="panel-body">
        ${r.artifacts.map(a=>`
          <div class="artifact-row">
            <span class="badge lock">${a.kind}</span>
            <div style="flex:1"><div class="fname">${esc(a.name)}</div><div class="fmeta">sha256:${a.sha} · ${a.size}</div></div>
            <button class="btn sm ghost" onclick="toast('下载 ${a.name}（原型演示）')">下载</button>
          </div>`).join("")}
        <p style="font-size:12px;color:var(--muted);margin-top:12px">文件快照有大小限制，不是完整文件系统备份；导出元数据与 ZIP 打包上限 128 MB。</p>
      </div>
    </div>`;
  } else if (state.runTab === "usage") {
    const u = r.usage;
    const tot = u.target.in + u.target.out;
    const seg = (v,c) => `<i style="width:${(v/tot*100).toFixed(1)}%;background:${c}"></i>`;
    body = `
    <div class="panel"><div class="panel-head"><h3>Token 分解 · Target</h3><span class="micro-label">cached / reasoning 不叠加进总量</span></div>
      <div class="panel-body">
        <div class="tok-bar">${seg(u.target.in-u.target.cachedIn,"var(--info)")}${seg(u.target.cachedIn,"#B9CBD8")}${seg(u.target.out-u.target.reasoning,"var(--accent)")}${seg(u.target.reasoning,"var(--warn)")}</div>
        <div class="tok-legend">
          <span><span class="sw" style="background:var(--info)"></span>input <b class="mono">${(u.target.in-u.target.cachedIn).toLocaleString()}</b></span>
          <span><span class="sw" style="background:#B9CBD8"></span>cached_input <b class="mono">${u.target.cachedIn.toLocaleString()}</b></span>
          <span><span class="sw" style="background:var(--accent)"></span>output（非 reasoning）<b class="mono">${(u.target.out-u.target.reasoning).toLocaleString()}</b></span>
          <span><span class="sw" style="background:var(--warn)"></span>reasoning <b class="mono">${u.target.reasoning.toLocaleString()}</b></span>
          <span>cache_write <b class="mono">${u.target.cacheWrite}</b></span>
        </div>
      </div>
    </div>
    <div class="stat-tiles" style="margin-bottom:18px">
      <div class="stat-tile"><span class="micro-label">Target 调用</span><div class="v">${u.target.calls} <small>次 · 重试 ${u.target.retries}</small></div></div>
      <div class="stat-tile"><span class="micro-label">Judge tokens</span><div class="v">${(u.judge.in+u.judge.out).toLocaleString()} <small>in ${u.judge.in} / out ${u.judge.out}</small></div></div>
      <div class="stat-tile"><span class="micro-label">上游费用</span><div class="v">$${u.cost[0].amount.toFixed(4)} <small>${u.cost[0].ccy} · 按币种累计</small></div></div>
      <div class="stat-tile"><span class="micro-label">耗时</span><div class="v">${u.latency.mean} <small>P50 ${u.latency.p50} · P95 ${u.latency.p95}</small></div></div>
      <div class="stat-tile"><span class="micro-label">输出量</span><div class="v">${u.outputChars} <small>字符 / ${u.outputBytes} 字节</small></div></div>
      <div class="stat-tile"><span class="micro-label">日志 / 工件</span><div class="v">${(u.logBytes/1024).toFixed(1)}K <small>+ ${(u.artifactBytes/1024).toFixed(1)}K 工件</small></div></div>
    </div>
    <div class="panel"><div class="panel-body">
      <span class="micro-label">用量告警</span>
      ${u.warnings.map(w=>`<div class="csrf-note" style="margin-top:8px"><span class="led off" style="margin-top:4px;background:var(--warn)"></span><span>${esc(w)}</span></div>`).join("")}
      <p style="font-size:12px;color:var(--muted);margin-top:10px">每项计量附 known_samples；不同别名不相加，上游返回的费用按币种分别累计，不自动推算模型价格。TTFT、生成速率、CPU/内存实测尚未实现。</p>
    </div></div>`;
  }
  return shell(`
    <div class="panel">
      <div class="panel-body" style="display:flex;gap:20px;align-items:center;flex-wrap:wrap">
        <div>
          <div class="micro-label">RUN / ROLLOUT</div>
          <div style="font-size:17px;font-weight:600" class="mono">${r.id}</div>
          <div class="id-cell mt8">${r.caseId} · sandbox 隔离执行 · ${r.worker}</div>
        </div>
        <div class="spacer" style="flex:1"></div>
        ${badge(r.status)}
        <span class="badge ${r.status==="queued"?"running":"pass"}"><span class="led ${r.status==="queued"?"busy":"on"}"></span>${r.status==="queued"?"日志流式写入中":"已完成并核对工件"}</span>
      </div>
    </div>
    <div class="tabs">${tabs.map(([v,l])=>`<button class="tab ${state.runTab===v?"active":""}" onclick="setRunTab('${v}')">${l}</button>`).join("")}</div>
    ${body}
  `, "Run 详情", `<button class="btn ghost" onclick="state.detailId=state.detailId||'${experiments[0].id}';go('detail')">← 返回实验</button>`);
}

/* 日志流模拟：停留在 Run 详情·日志页且实验在跑时按游标追加 */
setInterval(() => {
  if (state.route !== "run" || state.runTab !== "logs") return;
  const exp = experiments.find(e=>e.status==="running");
  if (!exp || state.logLines.length >= LOG_POOL.length) { const hm = $("#logHasMore"); if (hm) hm.textContent = "has_more=false"; return; }
  const l = LOG_POOL[state.logLines.length];
  state.logLines.push({ no: state.logLines.length + 1, lv: l[0], tx: l[1] });
  const box = $("#logConsole");
  if (box) {
    const div = document.createElement("div");
    div.className = "ln " + l[0];
    div.innerHTML = `<span class="no">${state.logLines.length}</span><span>${esc(l[1])}</span>`;
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
  }
  const cur = $("#logCursor"); if (cur) cur.textContent = state.logLines.length;
}, 1500);

/* ================= 渲染与计时器 ================= */
function render() {
  const app = $("#app");
  const views = { login: viewLogin, overview: viewOverview, experiments: viewExperiments, detail: viewDetail, compare: viewCompare, datasets: viewDatasets, harnesses: viewHarnesses, evaluators: viewEvaluators, connections: viewConnections, tools: viewTools, keys: viewKeys, run: viewRun, traces: viewTraces };
  app.innerHTML = (views[state.route] || viewOverview)();
}

/* 会话倒计时 */
setInterval(() => {
  if (!state.authed) return;
  state.sessionLeft = Math.max(0, state.sessionLeft - 1);
  const clock = $("#sessClock"), bar = $("#sessBar");
  if (clock) {
    const h = Math.floor(state.sessionLeft / 3600);
    const m = String(Math.floor((state.sessionLeft % 3600) / 60)).padStart(2, "0");
    const s = String(state.sessionLeft % 60).padStart(2, "0");
    clock.textContent = h > 0 ? `${h}:${m}:${s}` : `${m}:${s}`;
  }
  if (bar) {
    bar.style.width = (state.sessionLeft / state.sessionTotal * 100) + "%";
    bar.classList.toggle("low", state.sessionLeft < 300);
  }
  if (state.sessionLeft === 0) {
    state.authed = false;
    toast("会话已过期，请重新登录", false);
    go("login");
  }
}, 1000);

/* 运行中实验的轻量进度轮询（模拟） */
setInterval(() => {
  const run = experiments.find(e => e.status === "running");
  if (!run) return;
  if (run.done < run.total && Math.random() > 0.35) {
    run.done++;
    const idx = run.done - 1;
    if (caseResults[idx] && caseResults[idx].status === "queued") {
      caseResults[idx].status = CASE_STATUS[(idx * 7) % CASE_STATUS.length];
      caseResults[idx].score = caseResults[idx].status === "pass" ? (0.7 + Math.random() * 0.25).toFixed(2) : caseResults[idx].status === "fail" ? "0.31" : "—";
      caseResults[idx].latency = (1 + Math.random() * 3).toFixed(1) + "s";
    }
    const bar = $("#runProg"), txt = $("#runProgTxt"), kpi = $("#kpiRate");
    if (bar) bar.style.width = (run.done / run.total * 100).toFixed(0) + "%";
    if (txt) txt.textContent = `${run.done}/${run.total}`;
    if (kpi) kpi.innerHTML = fmtPct(run.done / run.total * 0.78);
    if (run.done >= run.total) {
      run.status = "completed"; run.successRate = 0.78; run.execRate = 0.98;
      toast(`实验 ${run.id} 已完成 · 通过率 78%`);
      if (["overview","experiments","detail","run"].includes(state.route)) render();
    }
  }
}, 2000);

/* 初始化 */
(function init() {
  const r = location.hash.replace(/^#\//, "");
  if (r && r !== "login") state.route = r;
  render();
})();
</script>
</body>
</html>
