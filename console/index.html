<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LiteEval 控制台 · 原型 v1.1</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
/* ============ 设计基调：深色观测台（参照 STEALTH observability） ============ */
:root {
  --paper: #0A0C10;
  --panel: #12151C;
  --panel-warm: #171B24;
  --sand: #1C212C;
  --line: rgba(255,255,255,.07);
  --line-strong: rgba(255,255,255,.14);
  --ink: #EEF2F6;
  --ink-2: #9AA6B4;
  --muted: #5F6B7A;
  --accent: #3DD68C;
  --accent-deep: #7FE7B4;
  --accent-soft: rgba(61,214,140,.12);
  --pass: #3DD68C;
  --pass-soft: rgba(61,214,140,.12);
  --fail: #F1596B;
  --fail-soft: rgba(241,89,107,.12);
  --warn: #F5C044;
  --warn-soft: rgba(245,196,68,.12);
  --info: #7C9CE8;
  --info-soft: rgba(124,156,232,.12);
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", "Cascadia Mono", Consolas, "Courier New", monospace;
  --sans: "Inter", -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  --serif: Georgia, "Times New Roman", "Songti SC", "SimSun", serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { font-size: 14px; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
body::before {
  content: "";
  position: fixed; inset: 0;
  background: repeating-linear-gradient(0deg, transparent 0 3px, rgba(255,255,255,.02) 3px 4px);
  pointer-events: none; z-index: 0;
}
#app { position: relative; z-index: 1; }
::selection { background: rgba(61,214,140,.25); }
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,.14); border-radius: 3px; }
button { font-family: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible {
  outline: none; box-shadow: 0 0 0 2px var(--paper), 0 0 0 4px var(--accent);
}
.mono { font-family: var(--mono); }
.micro-label {
  font-family: var(--mono); font-size: 10px; font-weight: 500;
  letter-spacing: .14em; text-transform: uppercase; color: var(--muted);
}

/* ============ 按钮 ============ */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid var(--line); border-radius: 999px;
  background: var(--sand); color: var(--ink);
  padding: 7px 16px; font-size: 13px; font-weight: 500; letter-spacing: -.005em;
  transition: background .15s ease, border-color .15s ease, color .15s ease;
}
.btn:hover { background: #242B39; border-color: var(--line-strong); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #062316; font-weight: 600; }
.btn.primary:hover { background: var(--accent-deep); border-color: var(--accent-deep); }
.btn.ghost { background: transparent; color: var(--ink-2); }
.btn.ghost:hover { background: var(--sand); color: var(--ink); }
.btn.danger { color: var(--fail); border-color: var(--fail); background: transparent; }
.btn.danger:hover { background: var(--fail-soft); }
.btn.sm { padding: 4px 12px; font-size: 12px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }

/* ============ 登录页 ============ */
.login-wrap { min-height: 100vh; display: grid; grid-template-columns: 1.1fr 1fr; }
.login-hero { padding: 64px 56px; display: flex; flex-direction: column; justify-content: space-between; border-right: 1px solid var(--line); }
.login-hero .brand { display: flex; align-items: center; gap: 10px; }
.brand-mark {
  width: 30px; height: 30px; border: 1.5px solid var(--ink); border-radius: 50%;
  display: grid; place-items: center; font-family: var(--mono); font-size: 12px; font-weight: 700;
}
.login-hero h1 {
  font-family: var(--serif); font-size: 56px; font-weight: 400;
  line-height: 1.18; letter-spacing: -.015em; color: var(--ink);
}
.login-hero h1 em { font-style: normal; color: var(--accent); }
.login-hero .sub { color: var(--ink-2); max-width: 420px; margin-top: 18px; font-size: 15px; }
.hero-quote {
  font-family: var(--serif); font-size: 19px; line-height: 1.6; color: var(--ink-2);
  border-left: 2px solid var(--accent); padding-left: 18px; max-width: 400px;
}
.login-panel { padding: 64px 56px; display: flex; flex-direction: column; justify-content: center; }
.login-card { max-width: 380px; width: 100%; }
.field { margin-bottom: 18px; }
.field label { display: block; font-size: 12px; font-weight: 500; letter-spacing: .01em; margin-bottom: 6px; color: var(--ink-2); }
.field input, .field select, .field textarea {
  width: 100%; padding: 10px 14px; font-size: 14px; font-family: inherit;
  border: 1px solid var(--line-strong); border-radius: 10px; background: var(--panel-warm); color: var(--ink);
}
.field input:focus { border-color: var(--accent); }
.note {
  display: flex; gap: 8px; align-items: flex-start;
  font-size: 12px; color: var(--ink-2); background: var(--panel-warm);
  border: 1px dashed var(--line-strong); border-radius: 10px; padding: 10px 12px; margin: 14px 0;
}
.note.warn { background: rgba(245,196,68,.05); border-color: rgba(245,196,68,.25); }
.note.info { background: rgba(124,156,232,.06); border-color: rgba(124,156,232,.25); }
.note.fail { background: rgba(241,89,107,.06); border-color: rgba(241,89,107,.3); }
.divider { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 12px; margin: 22px 0; }
.divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }

/* ============ 应用骨架 ============ */
.shell { display: grid; grid-template-columns: 232px 1fr; min-height: 100vh; }
.sidebar {
  background: var(--paper); border-right: 1px solid var(--line); padding: 20px 14px;
  display: flex; flex-direction: column; gap: 2px;
  position: sticky; top: 0; height: 100vh;
}
.sidebar .brand { display: flex; align-items: center; gap: 10px; padding: 4px 10px 14px; }
.sidebar .brand b { font-size: 15px; letter-spacing: -.01em; }
.sidebar .brand span { font-family: var(--mono); font-size: 10px; color: var(--muted); display: block; }
.side-section { font-family: var(--mono); font-size: 10px; font-weight: 600; letter-spacing: .22em; text-transform: uppercase; color: var(--muted); padding: 14px 12px 6px; }
.nav-item {
  display: flex; align-items: center; gap: 10px; padding: 7px 12px;
  border-radius: 8px; font-size: 13px; font-weight: 500; letter-spacing: -.005em; color: var(--ink-2);
  cursor: pointer; border: none; background: none; width: 100%; text-align: left;
  transition: background .15s ease, color .15s ease;
}
.nav-item:hover { background: var(--sand); color: var(--ink); }
.nav-item.active { background: var(--accent-soft); color: var(--accent-deep); font-weight: 600; }
.nav-item .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--line-strong); flex: none; }
.nav-item.active .dot { background: var(--accent); }
.nav-item .count { margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--muted); }
.nav-item .alert-count { margin-left: auto; font-family: var(--mono); font-size: 10px; background: var(--fail); color: #fff; border-radius: 999px; padding: 1px 7px; }
.ws-switch {
  display: flex; align-items: center; gap: 8px; margin: 2px 4px 6px; padding: 8px 10px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
  font-size: 12.5px; color: var(--ink); cursor: pointer; transition: border-color .15s ease; width: calc(100% - 8px);
}
.ws-switch:hover { border-color: var(--line-strong); }
.ws-switch .ava { width: 20px; height: 20px; border-radius: 6px; background: linear-gradient(135deg, var(--accent), var(--info)); flex: none; }
.ws-switch .swap { margin-left: auto; color: var(--muted); font-family: var(--mono); font-size: 11px; }
.sidebar-foot { margin-top: auto; border-top: 1px solid var(--line); padding-top: 14px; }
.user-card {
  display: flex; align-items: center; gap: 10px; padding: 10px; margin-bottom: 10px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
}
.user-card .ava { width: 28px; height: 28px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), var(--info)); display: grid; place-items: center; font-size: 11px; font-weight: 700; color: #062316; flex: none; }
.user-card .who { font-size: 12.5px; font-weight: 600; line-height: 1.3; }
.user-card .sess { font-family: var(--mono); font-size: 10px; color: var(--muted); }

.main { padding: 0 32px 48px; min-width: 0; }
.topbar {
  display: flex; align-items: center; gap: 14px;
  padding: 18px 0 16px; border-bottom: 1px solid var(--line); margin-bottom: 24px;
}
.topbar h2 { font-size: 21px; font-weight: 600; letter-spacing: -.025em; }
.topbar .spacer, .spacer { flex: 1; }
.worker-pill {
  display: inline-flex; align-items: center; gap: 7px; font-family: var(--mono); font-size: 11px;
  border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; color: var(--ink-2); background: var(--panel);
}
.lang-toggle { display: flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.lang-toggle button { border: none; background: transparent; color: var(--ink-2); font-size: 11.5px; font-family: var(--mono); padding: 4px 12px; }
.lang-toggle button.cur { background: var(--ink); color: var(--paper); font-weight: 600; }

/* 状态灯 */
.led { width: 8px; height: 8px; border-radius: 50%; flex: none; position: relative; }
.led.on { background: var(--pass); }
.led.on::after { content: ""; position: absolute; inset: -4px; border-radius: 50%; border: 1px solid var(--pass); opacity: 0; animation: pulse 1.6s ease-in-out infinite; }
.led.busy { background: var(--accent); }
.led.busy::after { content: ""; position: absolute; inset: -4px; border-radius: 50%; border: 1px solid var(--accent); opacity: 0; animation: pulse 1.4s ease-in-out infinite; }
.led.off { background: var(--line-strong); }
@keyframes pulse { 0% { transform: scale(.5); opacity: .9; } 100% { transform: scale(1.4); opacity: 0; } }

/* ============ 通用组件 ============ */
.kpi-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 22px; }
.kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 18px 20px; position: relative; overflow: hidden; }
.kpi .micro-label { margin-bottom: 8px; display: block; letter-spacing: .12em; }
.kpi .num { font-family: var(--mono); font-size: 34px; font-weight: 600; letter-spacing: -.035em; font-feature-settings: "tnum"; }
.kpi .num small { font-size: 14px; color: var(--muted); font-weight: 400; }
.kpi .trend { font-size: 12px; font-weight: 500; margin-top: 4px; }
.kpi .trend.up { color: var(--pass); }
.kpi .trend.down { color: var(--fail); }

.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; margin-bottom: 18px; }
.panel-head { display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.panel-head h3 { font-size: 13.5px; font-weight: 600; letter-spacing: -.01em; }
.panel-body { padding: 16px 18px; }

/* 演示数据常驻标识（PRD 1.1 §1） */
.demo-tag {
  display: inline-flex; align-items: center; gap: 5px; flex: none;
  font-family: var(--mono); font-size: 10px; font-weight: 600; letter-spacing: .08em;
  color: var(--warn); background: var(--warn-soft); border: 1px dashed rgba(245,196,68,.4);
  border-radius: 999px; padding: 2px 10px;
}
/* 后端能力标识（PRD 1.1 §4 对照） */
.cap {
  display: inline-flex; align-items: center; gap: 5px; flex: none;
  font-family: var(--mono); font-size: 10px; font-weight: 600; letter-spacing: .04em;
  border-radius: 6px; padding: 2px 8px; border: 1px solid transparent; white-space: nowrap;
}
.cap.http { color: var(--pass); background: var(--pass-soft); border-color: rgba(61,214,140,.3); }
.cap.part { color: var(--info); background: var(--info-soft); border-color: rgba(124,156,232,.3); }
.cap.cli  { color: var(--warn); background: var(--warn-soft); border-color: rgba(245,196,68,.3); }
.cap.todo { color: var(--muted); background: var(--sand); border-color: var(--line-strong); }

/* CLI 命令块 */
.cli-block {
  font-family: var(--mono); font-size: 12px; line-height: 1.7;
  background: #0B0E13; color: #D5DEE8; border: 1px solid var(--line);
  border-radius: 10px; padding: 12px 16px; overflow-x: auto; white-space: pre-wrap; word-break: break-all;
}
.cli-block .cmt { color: var(--muted); }

/* 表格 */
table.grid { width: 100%; border-collapse: collapse; font-size: 13px; }
table.grid th {
  text-align: left; font-family: var(--mono); font-size: 10px; letter-spacing: .12em;
  text-transform: uppercase; color: var(--muted); font-weight: 500;
  padding: 10px 14px; border-bottom: 1px solid var(--line-strong);
}
table.grid td { padding: 11px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; font-size: 13px; }
table.grid tr:last-child td { border-bottom: none; }
table.grid tbody tr.clickable { cursor: pointer; transition: background .12s ease; }
table.grid tbody tr.clickable:hover { background: rgba(255,255,255,.03); }
.id-cell { font-family: var(--mono); font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; }

/* 徽章 */
.badge {
  display: inline-flex; align-items: center; gap: 5px;
  font-family: var(--mono); font-size: 11px; font-weight: 500; letter-spacing: .02em;
  padding: 2px 10px; border-radius: 999px; border: 1px solid transparent; white-space: nowrap;
}
.badge.pass { color: var(--pass); background: var(--pass-soft); border-color: rgba(61,214,140,.3); }
.badge.fail { color: var(--fail); background: var(--fail-soft); border-color: rgba(241,89,107,.3); }
.badge.abstain { color: var(--ink-2); background: var(--sand); border-color: var(--line-strong); }
.badge.error { color: var(--warn); background: var(--warn-soft); border-color: rgba(245,196,68,.3); }
.badge.running { color: var(--accent-deep); background: var(--accent-soft); border-color: rgba(61,214,140,.3); }
.badge.queued { color: var(--info); background: var(--info-soft); border-color: rgba(124,156,232,.3); }
.badge.lock { color: var(--ink-2); background: transparent; border-color: var(--line-strong); }
.badge .led { width: 6px; height: 6px; }

/* 进度条 */
.prog { height: 6px; background: var(--sand); border-radius: 3px; overflow: hidden; min-width: 90px; }
.prog i { display: block; height: 100%; background: var(--accent); border-radius: 3px; transition: width .5s ease; }
.prog.done i { background: var(--pass); }
.prog.fail i { background: var(--fail); }

/* 筛选与分页 */
.toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.chip {
  border: 1px solid var(--line); background: transparent; border-radius: 999px;
  padding: 4px 14px; font-size: 12.5px; color: var(--ink-2); transition: all .15s ease;
}
.chip:hover { border-color: var(--line-strong); color: var(--ink); }
.chip.active { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.pager { display: flex; align-items: center; gap: 8px; justify-content: flex-end; padding: 12px 18px; }
.pager .info { font-family: var(--mono); font-size: 11px; color: var(--muted); margin-right: auto; }
.pager button {
  width: 28px; height: 28px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--panel); color: var(--ink-2); font-family: var(--mono); font-size: 12px;
}
.pager button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.pager button.cur { background: var(--accent); border-color: var(--accent); color: #fff; }

/* 抽屉与弹窗 */
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; z-index: 40; }
.overlay.show { display: block; animation: fadeIn .18s ease; }
@keyframes fadeIn { from { opacity: 0; } }
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(620px, 94vw);
  background: var(--panel); border-left: 1px solid var(--line-strong);
  transform: translateX(100%); transition: transform .28s cubic-bezier(.32,.72,.28,1);
  z-index: 50; display: flex; flex-direction: column;
}
.drawer.show { transform: translateX(0); }
.drawer-head { padding: 18px 22px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }
.drawer-body { flex: 1; overflow-y: auto; padding: 20px 22px; }
.raw-block {
  font-family: var(--mono); font-size: 12px; line-height: 1.7;
  background: #0B0E13; color: #D5DEE8; border: 1px solid var(--line); border-radius: 10px;
  padding: 14px 16px; overflow-x: auto; white-space: pre;
}
.modal {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%) scale(.96);
  width: min(560px, 94vw); max-height: 88vh; overflow-y: auto; background: var(--panel); border: 1px solid var(--line-strong);
  border-radius: 16px; z-index: 60; opacity: 0; pointer-events: none;
  transition: opacity .18s ease, transform .18s ease; box-shadow: 0 24px 60px rgba(0,0,0,.55);
}
.modal.show { opacity: 1; transform: translate(-50%,-50%) scale(1); pointer-events: auto; }
.modal-body { padding: 24px; }
.modal-foot { padding: 14px 24px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: 10px; }

/* 新建评测向导步骤条 */
.steps { display: flex; gap: 4px; margin-bottom: 18px; }
.step { flex: 1; text-align: center; padding: 8px 4px; border-bottom: 2px solid var(--line); font-size: 12px; color: var(--muted); }
.step.cur { color: var(--accent-deep); border-bottom-color: var(--accent); font-weight: 600; }
.step.done { color: var(--ink-2); border-bottom-color: var(--line-strong); }
.step .no { font-family: var(--mono); font-size: 10px; display: block; letter-spacing: .14em; }

/* 预检清单 */
.check-row { display: flex; align-items: flex-start; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 12.5px; }
.check-row:last-child { border-bottom: none; }
.check-row .ico { flex: none; width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 700; margin-top: 1px; }
.check-row .ico-ok { background: var(--pass-soft); color: var(--pass); }
.check-row .ico-block { background: var(--fail-soft); color: var(--fail); }
.check-row .ico-rt { background: var(--warn-soft); color: var(--warn); }

/* Toast */
.toasts { position: fixed; bottom: 24px; right: 24px; z-index: 90; display: flex; flex-direction: column; gap: 10px; }
.toast {
  background: #E8EDF3; color: #0A0C10; border-radius: 12px; padding: 12px 18px;
  font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 10px;
  box-shadow: 0 12px 32px rgba(0,0,0,.5); animation: toastIn .25s cubic-bezier(.32,.72,.28,1);
  max-width: 380px;
}
@keyframes toastIn { from { transform: translateY(12px); opacity: 0; } }
.toast .led { width: 7px; height: 7px; }

/* 空状态 */
.empty { border: 1px dashed var(--line-strong); border-radius: 12px; padding: 36px; text-align: center; color: var(--muted); font-size: 13px; }

/* 时间线 / 日志 / 统计磁贴 / token 分解 / 工件行 / KV */
.timeline { position: relative; padding-left: 22px; }
.timeline::before { content: ""; position: absolute; left: 6px; top: 6px; bottom: 6px; width: 1px; background: var(--line-strong); }
.timeline .ev { position: relative; padding-bottom: 14px; font-size: 12.5px; color: var(--ink-2); }
.timeline .ev::before { content: ""; position: absolute; left: -20px; top: 5px; width: 7px; height: 7px; border-radius: 50%; background: var(--panel); border: 1.5px solid var(--line-strong); }
.timeline .ev.hot::before { border-color: var(--accent); background: var(--accent); }
.timeline .ev b { color: var(--ink); font-weight: 600; }
.timeline .ev .t { font-family: var(--mono); font-size: 10.5px; color: var(--muted); margin-left: 6px; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 16px; }
.tab { border: none; background: none; padding: 9px 16px; font-size: 13px; font-weight: 500; color: var(--ink-2); border-bottom: 2px solid transparent; margin-bottom: -1px; transition: color .15s ease, border-color .15s ease; }
.tab:hover { color: var(--ink); }
.tab.active { color: var(--accent-deep); border-bottom-color: var(--accent); font-weight: 600; }
.log-console { background: #0B0E13; border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; font-family: var(--mono); font-size: 12px; line-height: 1.75; max-height: 420px; overflow-y: auto; }
.log-console .ln { display: flex; gap: 12px; white-space: pre-wrap; word-break: break-all; }
.log-console .ln .no { color: #4A5563; flex: none; width: 44px; text-align: right; user-select: none; }
.log-console .ln.warn { color: #E5B95C; }
.log-console .ln.err { color: #E88A70; }
.log-console .ln.tool { color: #9FC3E8; }
.log-cursor-bar { display: flex; align-items: center; gap: 10px; margin-top: 10px; font-family: var(--mono); font-size: 11px; color: var(--muted); }

function badge(st) {
  const cls = { pass: "pass", fail: "fail", abstain: "abstain", error: "error", running: "running", queued: "queued", completed: "pass", failed: "fail", cancelled: "abstain", done: "pass" }[st] || "queued";
  const led = st === "running" ? '<span class="led busy"></span>' : "";
  return `<span class="badge ${cls}">${led}${STATUS_CN[st] || st}</span>`;
}
function cap(kind) { return `<span class="cap ${kind}">${t("cap" + kind[0].toUpperCase() + kind.slice(1))}</span>`; }
function demoTag() { return `<span class="demo-tag">${t("demo")}</span>`; }
function toast(msg, ok = true) {
  const el = document.createElement("div");
  el.className = "toast";
  el.innerHTML = `<span class="led ${ok ? "on" : "off"}" style="${ok ? "" : "background:var(--fail)"}"></span>${esc(msg)}`;
  $("#toasts").appendChild(el);
  setTimeout(() => { el.style.opacity = "0"; el.style.transition = "opacity .3s"; setTimeout(() => el.remove(), 320); }, 3600);
}

/* ---------- 路由（刷新后通过项目与运行 ID 恢复，PRD §1） ---------- */
function go(route, arg) {
  if (!state.authed && route !== "login") route = "login";
  state.route = route;
  if (arg && arg.runId) state.runId = arg.runId;
  if (arg && arg.releaseId) state.releaseId = arg.releaseId;
  const p = state.projectId ? `?p=${state.projectId}` : "";
  const r = state.runId && route === "run" ? `/${state.runId}` : "";
  location.hash = `#/${route}${r}${p}`;
  render();
}
window.addEventListener("hashchange", () => {
  const m = location.hash.match(/^#\/(\w+)(?:\/(\w+))?(?:\?p=(\w+))?/);
  if (!m) return;
  if (m[3] && m[3] !== state.projectId) state.projectId = m[3];
  if (m[2]) state.runId = m[2];
  const r = state.authed ? m[1] : "login";
  if (r !== state.route) { state.route = r; render(); }
});
</script>

<script>

          ${[["all", "全部状态"], ["running", "运行中"], ["completed", "已完成"]].map(([v, l]) => `<button class="chip ${state.runStatus === v ? "active" : ""}" onclick="state.runStatus='${v}';state.runPage=1;render()">${l}</button>`).join("")}

function toggleCmp(id) {

function compareBlock(aId, bId) {
  const a = runs.find(r => r.id === aId), b = runs.find(r => r.id === bId);
  const sameRelease = a.releaseId && a.releaseId === b.releaseId;
  const checks = [
    ["评测集摘要", sameRelease ? "一致 ✓" : `${a.release} ≠ ${b.release}`, sameRelease],
    ["题目集合", sameRelease ? "一致 ✓" : "不一致", sameRelease],
    ["评分规则 / 评分 Harness", a.evalHarness === b.evalHarness ? "一致 ✓" : `${a.evalHarness} ≠ ${b.evalHarness}`, a.evalHarness === b.evalHarness],
    ["运行环境", "镜像 digest 一致 ✓", true],
  ];
  const variable = a.agentHarness !== b.agentHarness ? `Agent Harness：${a.agentHarness} → ${b.agentHarness}` : (a.conn !== b.conn ? `模型连接：${a.conn} → ${b.conn}` : "被测配置");
  const aligned = checks.every(c => c[2]);
  return `
    <table class="grid" style="margin-bottom:14px">
      <thead><tr><th>对比条件</th><th>核对结果</th></tr></thead>

          <div class="stat-tile"><span class="micro-label">${bId}</span><div class="v">${b.passed}/${b.scored}</div><div class="font-size:11px" style="font-size:11px;color:var(--muted)">已评分通过率 · 覆盖率 ${Math.round(b.scored / b.planned * 100)}%</div></div>

        <p style="font-size:12px;color:var(--muted);margin-top:10px">逐题变化明细与耗时/用量对比在 Native 对比接口落地后展示（待实现）；以上为演示口径。</p>`
      : `<div class="note fail"><span class="led off" style="margin-top:4px;background:var(--fail)"></span><span>对比条件不一致：仅展示配置差异，<b>质量变化结论不可用</b>。可先对其中一侧重新运行以对齐题目集合与评分规则。</span></div>`}`;
}

      ${blocked ? `<div class="note fail"><span class="led off" style="margin-top:4px;background:var(--fail)"></span><span>存在阻塞项，提交不可用。修复后重新预检。</span></div>` : ""}
      <div class="note warn"><span class="led off" style="margin-top:4px;background:var(--warn)"></span><span><b>Web 提交待实现</b>（PRD §4）。当前经 CLI 提交：</span></div>
      <div class="cli-block">python -m liteeval.interfaces.cli.main benchmark run \\

  }
  return shell(`
    <div class="panel" style="max-width:860px">
      <div class="panel-head"><h3>${t("newEval").replace("＋ ", "")}</h3><span class="micro-label">Benchmarks → New Evaluation · 从版本进入已自动填入</span><div class="spacer"></div>${cap("cli")}</div>

            ${envStatus.map(e => `
              <div style="display:flex;gap:10px;align-items:center;font-size:12.5px">
                <span class="led ${e.ok === true ? "on" : e.ok === false ? "off" : "busy"}" style="${e.ok === false ? "background:var(--fail)" : ""}"></span>
                <span style="flex:1">${esc(e.name)}</span>
                <span class="id-cell">${esc(e.kind)}</span>
              </div>`).join("")}
            <p style="font-size:12px;color:var(--muted);margin-top:4px">Worker 仅上报环境变量名与是否存在，不上报变量值。命令可用性检查不代表账号、镜像与沙箱已验收。</p>
          </div>
        </div>
      </div>
    </div>
  `, t("settings"));
}
function issueKey() {
  const label = prompt("Key 标签（字母、数字、中划线）：", "ci-runner");
  if (label === null) return;
  if (!/^[\w-]{1,40}$/.test(label)) { toast("标签仅允许字母、数字、下划线与中划线", false); return; }
  projectKeys.unshift({ id: "pk_" + Math.random().toString(16).slice(2, 6), label, prefix: "ltsk_" + Math.random().toString(36).slice(2, 6), created: "刚刚", revoked: false });
  toast(`项目 Key 已签发，明文仅本次显示（演示不展示）`); render();
}
function revokeKey(id) { projectKeys.find(k => k.id === id).revoked = true; toast(`Key ${id} 已撤销，即刻失效`); render(); }

/* ================= 视图：Trace 导入（Dataset 来源） ================= */
function viewTraces() {
  return shell(`
    <div class="panel">
      <div class="panel-head"><h3>生产 Trace</h3><span class="badge lock">Dataset 来源</span>${cap("http")}<span class="micro-label">既有 Dataset 链路 · Trace → Case → 版本</span>${demoTag()}
        <div class="spacer"></div><button class="btn primary sm" onclick="toast('所选 Trace 已转为 Case 草稿，请补充期望答案（演示）')">批量转为 Case</button></div>
      <table class="grid">
        <thead><tr><th>Trace</th><th>Agent</th><th>时间</th><th>摘要</th><th></th></tr></thead>
        <tbody>${traces.map(tr => `
          <tr>
            <td class="id-cell">${tr.id}</td><td class="id-cell">${tr.agent}</td><td class="mono">${tr.when}</td>
            <td>${tr.flagged ? '<span class="led busy" style="display:inline-block;margin-right:6px"></span>' : ""}${esc(tr.summary)}</td>
            <td><button class="btn sm" onclick="toast('Trace ${tr.id} 已转为 Case 草稿（Dataset 来源）')">转为 Case</button></td>
          </tr>`).join("")}</tbody>
      </table>
      <div class="panel-body" style="border-top:1px solid var(--line);font-size:12.5px;color:var(--ink-2)">
        转为 Case 后补充期望答案并冻结进数据集版本；缺少期望答案的 Case 评测时计为「未评分」，不冒充通过。Trace 转目录题目（Task）的转换为待实现能力。
      </div>
    </div>
  `, t("traces"), `<button class="btn ghost" onclick="go('benchmarks');state.benchTab='import';render()">← 导入来源</button>`);
}

/* ================= 渲染与计时器 ================= */
function render() {
  const app = $("#app");
  const views = { login: viewLogin, overview: viewOverview, benchmarks: viewBenchmarks, runs: viewRuns, run: viewRun, wizard: viewWizard, config: viewConfig, settings: viewSettings, traces: viewTraces };
  app.innerHTML = (views[state.route] || viewOverview)();
}
setInterval(() => {
  if (!state.authed) return;
  state.sessionLeft = Math.max(0, state.sessionLeft - 1);
  const clock = $("#sessClock");
  if (clock) {
    const h = Math.floor(state.sessionLeft / 3600);
    const m = String(Math.floor((state.sessionLeft % 3600) / 60)).padStart(2, "0");
    clock.textContent = h > 0 ? `${h}:${m}:${String(state.sessionLeft % 60).padStart(2, "0")}` : `${m}:${String(state.sessionLeft % 60).padStart(2, "0")}`;
  }
  if (state.sessionLeft === 0) { state.authed = false; toast("会话已过期，请重新登录", false); go("login"); }
}, 1000);
/* 运行中日志追加模拟（仅停留在运行详情·日志页时） */
setInterval(() => {
  if (state.route !== "run" || state.runTab !== "logs") return;
  const r = runs.find(x => x.id === state.runId);
  if (!r || r.status !== "running" || state.logLines.length >= LOG_POOL.length) { const hm = $("#logHasMore"); if (hm) hm.textContent = "EOF"; return; }
  const l = LOG_POOL[state.logLines.length];
  state.logLines.push({ no: state.logLines.length + 1, lv: l[0], tx: l[1] });
  const box = $("#logConsole");
  if (box) {
    const div = document.createElement("div");
    div.className = "ln " + l[0];
    div.innerHTML = `<span class="no">${state.logLines.length}</span><span>${esc(l[1])}</span>`;
    box.appendChild(div); box.scrollTop = box.scrollHeight;
  }
}, 1500);
/* 初始化：从 hash 恢复项目与运行 ID（PRD §1 刷新恢复） */
(function init() {
  if (!projects.some(p => p.id === state.projectId)) state.projectId = projects[0].id;
  const m = location.hash.match(/^#\/(\w+)(?:\/(\w+))?(?:\?p=(\w+))?/);
  if (m) {
    if (m[3] && projects.some(p => p.id === m[3])) state.projectId = m[3];
    if (m[2]) state.runId = m[2];
    if (m[1] && m[1] !== "login") state.route = m[1];
  }
  render();
})();
</script>
</body>
</html>
