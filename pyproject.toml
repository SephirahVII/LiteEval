[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "liteeval-local"
version = "0.3.1"
description = "Local-first Agent regression evaluation backend"
requires-python = ">=3.11"
dependencies = ["cryptography>=42"]

[project.scripts]
liteeval = "liteeval.cli:main"

[tool.setuptools.packages.find]
include = ["liteeval*"]
