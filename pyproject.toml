[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "liteeval-local"
version = "0.1.0"
description = "Local-first Agent evaluation prototype"
requires-python = ">=3.11"

[project.scripts]
liteeval = "liteeval.cli:main"

[tool.setuptools.packages.find]
include = ["liteeval*"]
