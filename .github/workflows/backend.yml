name: Backend regression

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  console-prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: node --test console/server.test.js console/prototype.test.js

  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13']
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python -m examples.platform smoke
      - run: python -m examples.platform readiness
      - run: python -m examples.platform catalog
      - name: Validate direct FAB CSV entry without model calls
        run: python -m examples.fab_v2 direct
      - name: Execute native directory benchmark with real subprocesses
        run: python -m examples.native_benchmark
      - name: Validate and publish native FAB public package without model calls
        run: python -m examples.fab_v2 prepare

  docker-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Prepare and freeze actual Docker image
        shell: bash
        run: |
          docker pull python:3.12-slim
          image=$(docker image inspect --format '{{index .RepoDigests 0}}' python:3.12-slim)
          echo "LITEEVAL_TEST_DOCKER_IMAGE=$image" >> "$GITHUB_ENV"
      - name: Real Docker execution and independent Judge
        run: python -m unittest discover -s tests -p test_native_benchmark.py -v
