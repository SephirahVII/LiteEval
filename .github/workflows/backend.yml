name: Backend regression

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13']
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python examples/run_demo.py
      - run: python examples/run_readiness_demo.py
      - run: python examples/run_catalog_demo.py
      - name: Prepare public finance benchmark without model calls
        run: python examples/run_finance_benchmark.py
      - name: Execute native directory benchmark with real subprocesses
        run: python examples/run_native_benchmark.py

  docker-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Prepare and freeze actual Docker image
        shell: bash
        run: |
          docker pull python:3.12-slim
          image=$(docker image inspect --format '{{index .RepoDigests 0}}' python:3.12-slim)
          echo "LITEEVAL_TEST_DOCKER_IMAGE=$image" >> "$GITHUB_ENV"
      - name: Real Docker execution and independent Judge
        run: python -m unittest discover -s tests -p test_native_benchmark.py -v
