schema_version = 1
[harness]
id = "community.responses-research"
role = "agent"
version = "1.0.0"
protocol = "liteeval.agent-events/v1"
[runtime]
command = ["{python}", "-B", "{harness}/agent.py"]
env = ["MODEL_BASE_URL", "MODEL_ID", "MODEL_API_KEY"]
env_optional = ["MODEL_PARAMETERS"]
[runtime.connection]
endpoint = "MODEL_BASE_URL"
model = "MODEL_ID"
api_key = "MODEL_API_KEY"
parameters = "MODEL_PARAMETERS"
[capabilities]
provides = ["web.search", "web.fetch"]
