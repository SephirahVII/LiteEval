schema_version = 1

[harness]
id = "community.deepseek-harness"
role = "agent"
version = "1.0.0"
protocol = "liteeval.agent/v1"

[runtime]
command = ["{python}", "{harness}/agent.py"]
env = ["DEEPSEEK_API_KEY"]
env_optional = ["DEEPSEEK_BASE_URL", "DSH_MODEL"]

[metadata]
purpose = "Headless DeepSeek Harness (dsh --profile headless) agent. Runs inside the task's Docker sandbox; the API key is resolved from the Worker environment and never stored."
