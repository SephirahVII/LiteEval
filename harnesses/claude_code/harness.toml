schema_version = 1

[harness]
id = "community.claude-code"
role = "agent"
version = "1.0.0"
protocol = "liteeval.agent/v1"

[runtime]
command = ["{python}", "{harness}/agent.py"]
env = ["ANTHROPIC_API_KEY"]
env_optional = ["ANTHROPIC_BASE_URL", "ANTHROPIC_MODEL", "CLAUDE_CODE_MAX_TURNS"]

[metadata]
purpose = "Headless Claude Code (claude -p) agent. Runs inside the task's Docker sandbox; the API key is resolved from the Worker environment and never stored."
